<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#007aff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Folio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/48.png">
<link rel="apple-touch-icon" href="icons/192.png">
<title>Folio</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="icons/128.png" alt="" width="24" height="24"><span>Folio</span></div>
    <nav id="nav"></nav>
  </aside>

  <main id="lib">
    <header class="top">
      <button id="btn-nav" class="icon" title="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <input id="search" type="search" placeholder="Search" autocomplete="off" title="Search ( / )">
      <span class="grow"></span>
      <select id="sort" title="Sort by">
        <option value="recent">Recent</option>
        <option value="added">Date Added</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
        <option value="progress">Progress</option>
        <option value="rating">Rating</option>
      </select>
      <div class="seg" id="viewseg">
        <button data-view="grid" title="Grid"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
        <button data-view="list" title="List"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      </div>
      <button id="btn-more" class="icon" title="More"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></svg></button>
      <button id="btn-import" class="primary">Add Books</button>
      <input id="file" type="file" multiple accept=".epub,.pdf,.txt,application/epub+zip,application/pdf,text/plain" hidden>
      <input id="backupfile" type="file" accept=".json" hidden>
    </header>
    <div class="heading"><h1 id="h1">All books</h1><span id="stats"></span></div>
    <div id="books"></div>
    <div id="empty" hidden>
      <h2>Your library is empty</h2>
      <p>Drag &amp; drop <b>EPUB</b>, <b>PDF</b> or <b>TXT</b> files anywhere on this page, or choose “Add Books”.<br>Everything is stored privately in your browser.</p>
    </div>
  </main>

  <div id="navscrim"></div>
  <div id="selbar" hidden></div>

  <section id="reader" hidden data-theme="light">
    <div class="rbar top">
      <button id="r-back" class="icon" title="Library (Esc)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-panel="toc" class="icon nopdf" title="Contents (T)"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" class="f"/><circle cx="4.5" cy="12" r="1" class="f"/><circle cx="4.5" cy="18" r="1" class="f"/></svg></button>
      <div class="rtitle"><b id="r-title"></b><span id="r-author"></span></div>
      <button data-panel="search" class="icon nopdf" title="Search in book (F)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
      <button id="r-pen" class="icon nopdf" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="M15 4l5 5-9.5 9.5H5.5v-5z"/><path class="ul" d="M4 21.5h9"/></svg></button>
      <button data-panel="marks" class="icon" title="Bookmarks &amp; highlights (M)"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M8 11h8M8 15h6"/></svg></button>
      <button id="r-bm" class="icon" title="Bookmark this page (B)"><svg viewBox="0 0 24 24"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
      <button id="r-set" class="nopdf" title="Appearance">Aa</button>
      <button id="r-fs" class="icon" title="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="rbody">
      <button class="edge prev nopdf" id="r-prev" title="Previous page"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div id="stage"><iframe id="frame" sandbox="allow-same-origin" title="Book"></iframe></div>
      <div id="pdfview" hidden tabindex="0"></div>
      <button class="edge next nopdf" id="r-next" title="Next page"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="r-foot" class="nopdf"></div>
    <div class="rbar bottom">
      <span id="r-chap"></span>
      <input id="r-seek" type="range" min="0" max="1000" value="0">
      <span id="r-pct">0%</span>
    </div>
    <aside id="panel" hidden>
      <div class="ptabs">
        <button data-panel="toc">Contents</button>
        <button data-panel="search">Search</button>
        <button data-panel="marks">Notes</button>
        <button id="p-close" class="x" title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="p-toc" class="pbody"></div>
      <div id="p-search" class="pbody" hidden>
        <form id="sform">
          <input id="sq" type="search" placeholder="Search in book" autocomplete="off">
          <div class="sbtns"><span id="scount"></span><button type="button" id="s-prev" title="Previous (Shift+Enter)">Previous</button><button type="button" id="s-next" title="Next (Enter)">Next</button></div>
        </form>
        <div id="sres"></div>
      </div>
      <div id="p-marks" class="pbody" hidden>
        <input id="mq" type="search" placeholder="Filter notes and highlights" autocomplete="off">
        <div id="mpages"><span>Page</span><input id="mp1" type="number" min="1" inputmode="numeric" placeholder="from" aria-label="From page"><span>to</span><input id="mp2" type="number" min="1" inputmode="numeric" placeholder="optional" aria-label="To page"><button id="mclear" type="button" hidden>Clear</button></div>
        <div id="mcount"></div>
        <div id="marks-list"></div>
      </div>
    </aside>
    <div id="setpop" hidden></div>
    <input type="color" id="penpick" class="hiddenpick" value="#ff8a00" tabindex="-1">
  </section>
</div>

<div id="pop" hidden></div>
<div id="hlbar" hidden></div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<div id="dropzone" hidden>Drop books to add them to your library</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
